version: "3.9"

services:

  app:
    image: breschi/cttools:latest
    container_name: cttools_app
    ports:
      - "8080:80"
    environment:
      # Laravel
      APP_NAME: "${APP_NAME}"
      APP_ENV: production
      APP_DEBUG: "${APP_DEBUG}"
      APP_KEY: "${APP_KEY}"
      APP_LOCALE: "${APP_LOCALE}"
      APP_TIMEZONE: "${APP_TIMEZONE}"

      # Database
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"

      # Redis / Queue / Cache
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      # Deve superare il timeout del job più lungo (SyncProducts: 900s),
      # altrimenti la coda rilascia job ancora in corso e li riesegue in
      # parallelo (inserzioni Cardtrader duplicate).
      REDIS_QUEUE_RETRY_AFTER: "1200"

      # Custom
      CT_DISABLE_PRICE: "${CT_DISABLE_PRICE}"

    depends_on:
      - db
      - redis
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: cttools_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    volumes:
      - dbdata:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: cttools_redis
    restart: unless-stopped
    volumes:
      - redisdata:/data

volumes:
  dbdata:
  redisdata:
