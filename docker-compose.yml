version: "3.9"

services:

  app:
    build: .
    container_name: laravel_app
    ports:
      - "8080:80"
    environment:
      APP_NAME: "CT Tools"
      APP_ENV: production
      APP_DEBUG: ${APP_DEBUG}
      APP_KEY: ${APP_KEY}
      APP_LOCALE: ${APP_LOCALE}
      APP_TIMEZONE: ${APP_TIMEZONE}

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis

      CT_DISABLE_PRICE: ${CT_DISABLE_PRICE}

    depends_on:
      - db
      - redis
    restart: unless-stopped


  horizon:
    build: .
    container_name: laravel_horizon
    command: php artisan horizon
    environment:
      APP_ENV: production
      APP_DEBUG: ${APP_DEBUG}
      APP_KEY: ${APP_KEY}

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: redis
      QUEUE_CONNECTION: redis

    depends_on:
      - db
      - redis
    restart: unless-stopped


  scheduler:
    build: .
    container_name: laravel_scheduler
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: redis

    depends_on:
      - db
      - redis
    restart: unless-stopped


  db:
    image: mysql:8.0
    container_name: laravel_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql


  redis:
    image: redis:7-alpine
    container_name: laravel_redis
    restart: unless-stopped
    volumes:
      - redisdata:/data


volumes:
  dbdata:
  redisdata:
